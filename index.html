<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PE sem Fome - Sistema Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #4CAF50;
            --danger-color: #F44336;
            --warning-color: #FF9800;
            --info-color: #2196F3;
            --background-light: #F5F7FA;
            --background-white: #FFFFFF;
            --text-dark: #333333;
            --text-light: #6c757d;
            --border-color: #E0E0E0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-light);
            color: var(--text-dark);
        }

        .hidden {
            display: none !important;
        }

        /* Layout Principal */
        .app-container {
            display: grid;
            grid-template-areas: 
                "header header"
                "sidebar main";
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr;
            min-height: 100vh;
        }
        
        .app-header {
            grid-area: header;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-title {
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .app-sidebar {
            grid-area: sidebar;
            background-color: var(--background-white);
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
            height: calc(100vh - 60px);
            overflow-y: auto;
        }
        
        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .nav-item {
            margin-bottom: 5px;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-dark);
            text-decoration: none;
            transition: all 0.3s;
            gap: 12px;
            font-size: 0.95rem;
        }
        
        .nav-link:hover {
            background-color: rgba(30, 58, 138, 0.1);
            color: var(--primary-color);
        }
        
        .nav-link.active {
            background-color: rgba(30, 58, 138, 0.2);
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
            font-weight: 500;
        }
        
        .submenu {
            padding-left: 20px;
            background-color: #f8f9fa;
        }
        
        .app-main {
            grid-area: main;
            padding: 20px;
            background-color: var(--background-light);
            overflow-y: auto;
            height: calc(100vh - 60px);
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .page-title {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .card {
            background-color: var(--background-white);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: var(--text-light);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .dashboard-card {
            background-color: var(--background-white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .dashboard-card:hover { transform: translateY(-5px); }

        .dashboard-card-title { font-size: 0.85rem; color: var(--text-light); font-weight: 600; }
        .dashboard-card-value { font-size: 1.8rem; font-weight: 700; color: var(--primary-color); margin: 5px 0; }

        .dashboard-charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .dashboard-chart {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            height: 350px;
        }

        /* Formulários */
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; }

        /* Botões */
        .btn { padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; border: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); }

        /* Modais */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-primary { background: #dbeafe; color: #1e3a8a; }

        /* Login */
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--primary-color); }
        .login-card { background: white; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <!-- Tela de Login -->
    <div id="login-page" class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="https://raw.githubusercontent.com/WagneCabral1982/PEsemFome2/main/Logotipo%20PE_sem_Fome.png" alt="Logo" width="80">
                <h2 style="color: var(--primary-color); margin-top: 10px;">Acesso Administrativo</h2>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Usuário</label>
                    <input type="text" id="username" class="form-control" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" id="password" class="form-control" placeholder="admin123" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Entrar</button>
                <p id="loginError" style="color: red; text-align: center; margin-top: 15px; display: none;">Credenciais inválidas</p>
            </form>
        </div>
    </div>

    <!-- Painel Principal -->
    <div id="admin-panel" class="app-container hidden">
        <header class="app-header">
            <div class="header-title">
                <img src="https://raw.githubusercontent.com/WagneCabral1982/PEsemFome2/main/Logotipo%20PE_sem_Fome.png" alt="Logo" width="40">
                PE sem Fome | Admin
            </div>
            <div class="user-menu">
                <span id="current-user-display">Administrador</span>
                <button class="logout-btn" onclick="handleLogout()">Sair</button>
            </div>
        </header>

        <nav class="app-sidebar">
            <ul class="nav-menu">
                <li class="nav-item"><a href="#" class="nav-link active" onclick="showPage('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li class="nav-item"><a href="#" class="nav-link" onclick="showPage('users')"><i class="fas fa-users"></i> Usuários</a></li>
                <li class="nav-item"><a href="#" class="nav-link" onclick="showPage('equipment')"><i class="fas fa-utensils"></i> Equipamentos</a></li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="toggleSubmenu(this)"><i class="fas fa-file-alt"></i> Relatórios <i class="fas fa-chevron-down" style="margin-left: auto;"></i></a>
                    <ul class="submenu nav-menu" style="display: none;">
                        <li><a href="#" class="nav-link" onclick="showPage('report-municipality')">Por Município</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <main class="app-main" id="main-content">
            <!-- Conteúdo Dinâmico -->
        </main>
    </div>

    <!-- Modal Novo Equipamento -->
    <div id="modal-equipment" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-eq-title">Novo Equipamento</h3>
                <button onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <form id="form-equipment">
                <input type="hidden" id="eq-id">
                <div class="form-group">
                    <label class="form-label">Nome do Equipamento</label>
                    <input type="text" id="eq-nome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Tipo</label>
                    <select id="eq-tipo" class="form-control" required>
                        <option value="cozinha">Cozinha Comunitária</option>
                        <option value="restaurante">Restaurante Popular</option>
                        <option value="CRAS">CRAS</option>
                        <option value="CREAS">CREAS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Município</label>
                    <select id="eq-municipio" class="form-control" required onchange="updateBairrosDropdown()">
                        <option value="Recife">Recife</option>
                        <option value="Olinda">Olinda</option>
                        <option value="Jaboatão dos Guararapes">Jaboatão dos Guararapes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Endereço</label>
                    <input type="text" id="eq-endereco" class="form-control" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Container de Alertas -->
    <div id="alert-container" style="position: fixed; top: 20px; right: 20px; z-index: 2000;"></div>

    <script>
        // Dados do Sistema
        let equipamentos = [
            { id: 1, nome: "Cozinha Comunitária: Gurupé", tipo: "cozinha", municipio: "Recife", endereco: "Rua Gurupé nº 253, Afogados", bairros: [1, 2] },
            { id: 2, nome: "CRAS Alto do Mandú", tipo: "CRAS", municipio: "Recife", endereco: "Rua Dr. Eurico Chaves, 370", bairros: [3] }
        ];

        const bairros = [
            { id: 1, nome: "Afogados", municipio: "Recife" },
            { id: 2, nome: "Água Fria", municipio: "Recife" },
            { id: 3, nome: "Alto do Mandu", municipio: "Recife" },
            { id: 4, nome: "Bairro Novo", municipio: "Olinda" },
            { id: 5, nome: "Piedade", municipio: "Jaboatão dos Guararapes" }
        ];

        const tiposNomes = {
            cozinha: "Cozinha Comunitária",
            restaurante: "Restaurante Popular",
            CRAS: "CRAS",
            CREAS: "CREAS"
        };

        let currentPage = 'dashboard';

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('form-equipment').addEventListener('submit', saveEquipment);
        });

        // Autenticação
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === 'admin123') {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                showPage('dashboard');
            } else {
                const err = document.getElementById('loginError');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        }

        function handleLogout() {
            location.reload();
        }

        // Navegação
        function showPage(page) {
            currentPage = page;
            updateSidebarUI();
            const container = document.getElementById('main-content');
            
            if (page === 'dashboard') renderDashboard(container);
            else if (page === 'equipment') renderEquipmentPage(container);
            else if (page === 'users') container.innerHTML = '<div class="card"><h3>Gestão de Usuários</h3><p>Módulo em desenvolvimento...</p></div>';
            else if (page === 'report-municipality') container.innerHTML = '<div class="card"><h3>Relatório por Município</h3><p>Módulo em desenvolvimento...</p></div>';
        }

        function updateSidebarUI() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('onclick')?.includes(currentPage)) link.classList.add('active');
            });
        }

        function toggleSubmenu(el) {
            const sub = el.nextElementSibling;
            sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
        }

        // Render Dashboard
        function renderDashboard(container) {
            container.innerHTML = `
                <div class="content-header">
                    <h1 class="page-title">Dashboard Operacional</h1>
                </div>
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <div class="dashboard-card-title">Total Indivíduos</div>
                        <div class="dashboard-card-value">4.876</div>
                        <div style="color: green; font-size: 0.8rem;"><i class="fas fa-arrow-up"></i> 12% este mês</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="dashboard-card-title">Equipamentos</div>
                        <div class="dashboard-card-value">${equipamentos.length}</div>
                        <div style="font-size: 0.8rem;">Ativos no Estado</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="dashboard-card-title">Situação de Rua</div>
                        <div class="dashboard-card-value">1.367</div>
                        <div style="color: var(--danger-color); font-size: 0.8rem;">Requer Atenção</div>
                    </div>
                </div>
                <div class="dashboard-charts-container">
                    <div class="dashboard-chart"><canvas id="chartMunicipios"></canvas></div>
                    <div class="dashboard-chart"><canvas id="chartEvolucao"></canvas></div>
                </div>
            `;
            initCharts();
        }

        function initCharts() {
            new Chart(document.getElementById('chartMunicipios'), {
                type: 'bar',
                data: {
                    labels: ['Recife', 'Jaboatão', 'Olinda', 'Caruaru'],
                    datasets: [{ label: 'Indivíduos', data: [1200, 980, 750, 520], backgroundColor: '#1e3a8a' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            new Chart(document.getElementById('chartEvolucao'), {
                type: 'line',
                data: {
                    labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai'],
                    datasets: [{ label: 'Cadastros', data: [300, 450, 380, 520, 610], borderColor: '#4CAF50', fill: false }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Gestão de Equipamentos
        function renderEquipmentPage(container) {
            container.innerHTML = `
                <div class="content-header">
                    <h1 class="page-title">Equipamentos Sociais</h1>
                    <button class="btn btn-primary" onclick="openEquipmentModal()"><i class="fas fa-plus"></i> Novo Equipamento</button>
                </div>
                <div class="card">
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="searchEq" class="form-control" placeholder="Buscar por nome ou endereço..." onkeyup="filterEquipment()">
                        <select id="filterTipo" class="form-control" style="max-width: 200px;" onchange="filterEquipment()">
                            <option value="">Todos os Tipos</option>
                            <option value="cozinha">Cozinha</option>
                            <option value="CRAS">CRAS</option>
                        </select>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Tipo</th>
                                    <th>Município</th>
                                    <th>Endereço</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="eq-table-body">
                                ${renderEqRows(equipamentos)}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderEqRows(data) {
            return data.map(eq => `
                <tr>
                    <td><strong>${eq.nome}</strong></td>
                    <td><span class="badge badge-primary">${tiposNomes[eq.tipo]}</span></td>
                    <td>${eq.municipio}</td>
                    <td>${eq.endereco}</td>
                    <td>
                        <button class="btn btn-outline" style="padding: 5px 10px;" onclick="editEquipment(${eq.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger" style="padding: 5px 10px;" onclick="deleteEquipment(${eq.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterEquipment() {
            const query = document.getElementById('searchEq').value.toLowerCase();
            const tipo = document.getElementById('filterTipo').value;
            
            const filtered = equipamentos.filter(eq => {
                const matchQuery = eq.nome.toLowerCase().includes(query) || eq.endereco.toLowerCase().includes(query);
                const matchTipo = tipo === "" || eq.tipo === tipo;
                return matchQuery && matchTipo;
            });
            
            document.getElementById('eq-table-body').innerHTML = renderEqRows(filtered);
        }

        // Modal Logic
        function openEquipmentModal(id = null) {
            const modal = document.getElementById('modal-equipment');
            const form = document.getElementById('form-equipment');
            form.reset();
            
            if (id) {
                const eq = equipamentos.find(e => e.id === id);
                document.getElementById('modal-eq-title').innerText = "Editar Equipamento";
                document.getElementById('eq-id').value = eq.id;
                document.getElementById('eq-nome').value = eq.nome;
                document.getElementById('eq-tipo').value = eq.tipo;
                document.getElementById('eq-municipio').value = eq.municipio;
                document.getElementById('eq-endereco').value = eq.endereco;
            } else {
                document.getElementById('modal-eq-title').innerText = "Novo Equipamento";
                document.getElementById('eq-id').value = "";
            }
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
        }

        function saveEquipment(e) {
            e.preventDefault();
            const id = document.getElementById('eq-id').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                nome: document.getElementById('eq-nome').value,
                tipo: document.getElementById('eq-tipo').value,
                municipio: document.getElementById('eq-municipio').value,
                endereco: document.getElementById('eq-endereco').value,
                bairros: []
            };

            if (id) {
                const index = equipamentos.findIndex(eq => eq.id === parseInt(id));
                equipamentos[index] = data;
                showAlert("Equipamento atualizado com sucesso!", "success");
            } else {
                equipamentos.push(data);
                showAlert("Equipamento cadastrado com sucesso!", "success");
            }

            closeModal();
            showPage('equipment');
        }

        function deleteEquipment(id) {
            if (confirm("Deseja realmente excluir este equipamento?")) {
                equipamentos = equipamentos.filter(eq => eq.id !== id);
                showPage('equipment');
                showAlert("Equipamento removido.", "info");
            }
        }

        // Utils
        function showAlert(msg, type) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            const colors = { success: '#4CAF50', info: '#2196F3', error: '#F44336' };
            
            alert.style.cssText = `background: ${colors[type]}; color: white; padding: 15px 25px; border-radius: 5px; margin-bottom: 10px; box-shadow: var(--shadow); animation: slideIn 0.3s forwards;`;
            alert.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
            
            container.appendChild(alert);
            setTimeout(() => {
                alert.style.animation = "slideOut 0.3s forwards";
                setTimeout(() => alert.remove(), 300);
            }, 3000);
        }
    </script>

    <style>
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</body>
</html>
